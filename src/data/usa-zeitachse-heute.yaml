- date: "1861-04-12"
  title: "Fort Sumter: Der Bürgerkrieg beginnt"
  text: "Truppen der Konföderation beschießen Fort Sumter in South Carolina."
- date: "1863-01-01"
  title: "Emancipation Proclamation"
  text: "Präsident Lincoln erklärt Menschen für frei, die in den Staaten im Aufstand versklavt sind."
- date: "1865-04-09"
  title: "Lee gibt bei Appomattox auf"
  text: "General Lee ergibt sich General Grant. Das Ende des Krieges beginnt."
- date: "1865-12-06"
  title: "Der 13. Zusatzartikel ist ratifiziert"
  text: "Die Verfassung verbietet Sklaverei, außer als Strafe für ein Verbrechen."
- date: "1868"
  title: "Der 14. Zusatzartikel"
  text: "Wer in den USA geboren oder eingebürgert ist, ist Bürger. Alle haben Anspruch auf gleichen Schutz durch das Gesetz."
- date: "1870-02-03"
  title: "Der 15. Zusatzartikel"
  text: "Das Wahlrecht der Bürger darf nicht wegen der Hautfarbe oder früherer Sklaverei verweigert werden."
- date: "1896"
  title: "Plessy gegen Ferguson"
  text: "Das Oberste Gericht erlaubt getrennte Einrichtungen für Weiße und Schwarze unter dem Satz „separate but equal“ (getrennt, aber gleichwertig)."
- date: "1954"
  title: "Brown gegen Board of Education"
  text: "Das Oberste Gericht entscheidet einstimmig: Getrennte öffentliche Schulen sind verfassungswidrig."
- date: "1955-12-01"
  title: "Rosa Parks wird verhaftet"
  text: "Sie bleibt in einem Bus in Montgomery sitzen und wird festgenommen."
- date: "1955-12-05"
  title: "Der Busboykott beginnt"
  text: "Viele Schwarze in Montgomery fahren nicht mehr mit dem Bus. Der Boykott dauert bis zum Dezember 1956."
- date: "1956-12-20"
  title: "Getrennte Sitzplätze in Bussen sind vorbei"
  text: "Das Urteil Browder gegen Gayle tritt in Kraft, der Boykott endet."
- date: "1963-08-28"
  title: "Marsch auf Washington"
  text: "Rund 250 000 Menschen nehmen teil. Martin Luther King hält dort eine Rede."
- date: "1964-07-02"
  title: "Civil Rights Act"
  text: "Das Gesetz verbietet Diskriminierung bei der Arbeit und in öffentlichen Einrichtungen."
- date: "1965-03-07"
  title: "Bloody Sunday in Selma"
  text: "Polizei stoppt und greift den ersten Marsch von Selma nach Montgomery an."
- date: "1965-08-06"
  title: "Voting Rights Act"
  text: "Präsident Johnson unterschreibt das Gesetz gegen Diskriminierung bei Wahlen."
