- date: 1607
  title: Die Virginia Colony beginnt
  text: "Die britische Besiedlung der Ostküste beginnt. Siedler aus England bekommen Land. Die Menschen, die dort schon lebten, haben jetzt Fremde im Land. (Quelle: Wikipedia, United States)"
- date: 1620
  title: Die Mayflower erreicht Cape Cod
  text: "Pilger aus England gründen die Plymouth Colony. Sie gewinnen einen Platz für ihre Kirche, aber fast die Hälfte stirbt im ersten Winter. (Quelle: Wikipedia, Pilgrims (Plymouth Colony))"
- date: 1621
  title: Friedensvertrag mit den Wampanoag
  text: "Die Pilger und Massasoit, ein Anführer der Wampanoag, schließen einen Friedensvertrag. Das Dorf Patuxet, wo die Pilger siedeln, liegt leer: Seine Bewohner sind vorher an einer Seuche gestorben. (Quelle: Wikipedia, Pilgrims (Plymouth Colony))"
- date: 1773
  title: Die Boston Tea Party
  text: "Siedler werfen Tee in den Hafen von Boston. Sie protestieren gegen britische Regeln. Die britische Regierung antwortet 1774 mit harten Gesetzen. (Quelle: Wikipedia, Boston Tea Party)"
- date: 1776
  title: Die Declaration of Independence
  text: "Am 4. Juli erklären die dreizehn Kolonien ihre Unabhängigkeit. Siedler gewinnen Selbstverwaltung, Großbritannien verliert Kolonien. In allen dreizehn Kolonien ist die Sklaverei erlaubt. (Quelle: Wikipedia, United States Declaration of Independence)"
- date: 1789
  title: Die Verfassung tritt in Kraft
  text: "Drei Gewalten teilen sich die Macht. George Washington wird erster Präsident. (Quelle: Wikipedia, United States)"
- date: 1803
  title: Der Louisiana Purchase
  text: "Die USA kaufen Frankreich ein Gebiet ab und werden fast doppelt so groß. Dort leben Native Americans: Bis in die 1870er Jahre kauft die Regierung ihnen Land ab. (Quelle: Wikipedia, American frontier)"
- date: 1830
  title: Der Indian Removal Act
  text: "Etwa sechzigtausend Native Americans müssen aus dem Südosten nach Westen ziehen. Siedler gewinnen Land, viele Menschen sterben auf dem Weg (Trail of Tears). (Quelle: Wikipedia, Trail of Tears)"
- date: 1862
  title: Der Homestead Act
  text: "Siedler bekommen hundertsechzig Acres Land gratis, wenn sie es fünf Jahre bearbeiten. Viel davon liegt auf den Plains, wo Native Americans leben. (Quelle: Wikipedia, American frontier)"
- date: 1869
  title: Die Eisenbahn von Küste zu Küste
  text: "Die Reise dauert nur noch etwa acht Tage statt Monate. Siedler und Händler gewinnen Zeit, die Bahn bringt noch mehr Siedler ins Land der Native Americans. (Quelle: Wikipedia, American frontier)"
- date: 1890
  title: Wounded Knee und das Ende der Siedlungsgrenze
  text: "Bei Wounded Knee sterben etwa einhundertfünfzig Sioux. Danach gibt es keine durchgehende Siedlungsgrenze mehr. Die Native Americans leben bis heute in den USA. (Quelle: Wikipedia, American frontier)"
- date: 1892
  title: Ellis Island öffnet
  text: "Hier prüft die Regierung Einwanderer aus Europa. Etwa zwölf Millionen kommen bis 1954 durch die Station, etwa zwei von hundert müssen zurück. (Quelle: Wikipedia, Ellis Island)"
