- date: 1607
  title: Die Virginia Colony beginnt
  text: "Mit der Virginia Colony beginnt die britische Besiedlung der Ostküste. Die Siedler bekommen ein neues Zuhause. Die Menschen, die dort schon lebten, müssen ihr Land nun mit Fremden teilen. (Quelle: Wikipedia, United States, https://en.wikipedia.org/wiki/United_States)"
- date: 1620
  title: Die Mayflower erreicht Cape Cod
  text: "Pilger aus England gründen die Plymouth Colony. Sie gewinnen einen Platz für ihre Kirche, aber fast die Hälfte stirbt im ersten Winter. (Quelle: Wikipedia, Pilgrims (Plymouth Colony), https://en.wikipedia.org/wiki/Pilgrims_(Plymouth_Colony))"
- date: 1621
  title: Friedensvertrag mit den Wampanoag
  text: "Die Pilger und Massasoit, ein Anführer der Wampanoag, schließen einen Friedensvertrag. Das Dorf Patuxet, wo die Pilger siedeln, liegt leer: Seine Bewohner sind vorher an einer Seuche gestorben. (Quelle: Wikipedia, Pilgrims (Plymouth Colony), https://en.wikipedia.org/wiki/Pilgrims_(Plymouth_Colony))"
- date: 1773
  title: Die Boston Tea Party
  text: "Männer aus Boston werfen Tee in den Hafen, einige verkleidet als Native Americans. Sie protestieren gegen britische Regeln. Die britische Regierung antwortet 1774 mit harten Gesetzen. (Quelle: Wikipedia, Boston Tea Party, https://en.wikipedia.org/wiki/Boston_Tea_Party)"
- date: 1775
  title: Der Krieg beginnt
  text: "Im April beginnt der Krieg zwischen Großbritannien und den Kolonien. Die Kolonisten wollen mitreden, Großbritannien will seine Kolonien behalten. (Quelle: Wikipedia, United States, https://en.wikipedia.org/wiki/United_States)"
- date: 1776
  title: Die Declaration of Independence
  text: "Am 4. Juli nimmt der Kongress die Erklärung an: Die dreizehn Kolonien sind unabhängig. Die Kolonisten gewinnen Selbstverwaltung, Großbritannien verliert Kolonien. In allen dreizehn Kolonien ist die Sklaverei erlaubt, versklavte Menschen sind nicht frei. (Quelle: Wikipedia, United States Declaration of Independence, https://en.wikipedia.org/wiki/United_States_Declaration_of_Independence)"
- date: 1789
  title: Die Verfassung tritt in Kraft
  text: "Drei Gewalten teilen sich die Macht: Kongress, Präsident und Supreme Court. Keine Gruppe hat alle Macht. (Quelle: Wikipedia, Constitution of the United States, https://en.wikipedia.org/wiki/Constitution_of_the_United_States)"
- date: 1830
  title: Der Indian Removal Act
  text: "Etwa sechzigtausend Native Americans müssen aus dem Südosten nach Westen ziehen. Siedler gewinnen Land, viele Menschen sterben auf dem Weg (Trail of Tears). (Quelle: Wikipedia, Trail of Tears, https://en.wikipedia.org/wiki/Trail_of_Tears)"
- date: 1862
  title: Der Homestead Act
  text: "Siedler bekommen hundertsechzig Acres Land gratis, wenn sie es fünf Jahre bearbeiten. Das Land lag vorher im Gebiet von Native Americans. (Quelle: Wikipedia, American frontier, https://en.wikipedia.org/wiki/American_frontier)"
- date: 1868
  title: Der Vertrag mit den Lakota
  text: "Die Regierung gibt den Lakota ein großes Reservat mit den Black Hills. Später finden Menschen dort Gold, und der Vertrag wird gebrochen. (Quelle: Wikipedia, American frontier, https://en.wikipedia.org/wiki/American_frontier)"
- date: 1869
  title: Die Eisenbahn von Küste zu Küste
  text: "Die erste Eisenbahn von Küste zu Küste ist fertig. Siedler und Händler kommen leichter nach Westen, und noch mehr Siedler kommen ins Land der Native Americans. (Quelle: Wikipedia, American frontier, https://en.wikipedia.org/wiki/American_frontier)"
- date: 1877
  title: Die Nez Perce und Chief Joseph
  text: "Die Nez Perce wollen ihr Land nicht aufgeben. Sie gehen etwa zwölfhundert Meilen und kämpfen unterwegs. Native Americans leben bis heute in den USA. (Quelle: Wikipedia, American frontier, https://en.wikipedia.org/wiki/American_frontier, und United States, https://en.wikipedia.org/wiki/United_States)"
- date: 1892
  title: Ellis Island öffnet
  text: "Hier prüft die Regierung Einwanderer aus Europa. Etwa zwölf Millionen Menschen werden bis 1954 geprüft, etwa zwei von hundert müssen zurück. (Quelle: Wikipedia, Ellis Island, https://en.wikipedia.org/wiki/Ellis_Island)"
