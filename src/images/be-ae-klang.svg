<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img">
  <title>Drei Wörter mit Lesehilfe für die britische und die amerikanische Aussprache</title>
  <rect width="480" height="310" fill="#f4efe2"/>
  <rect x="20" y="8" width="20" height="20" rx="3" fill="#2c6fd8" stroke="#333" stroke-width="1"/>
  <text x="48" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">britisch</text>
  <rect x="160" y="8" width="20" height="20" rx="3" fill="#d35400" stroke="#333" stroke-width="1"/>
  <text x="188" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">amerikanisch</text>
  <rect x="20" y="62" width="440" height="66" rx="6" fill="#f4efe2" stroke="#333" stroke-width="2"/>
  <text x="36" y="102" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">stork</text>
  <text x="200" y="90" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#2c6fd8">britisch: stohk</text>
  <text x="200" y="116" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#d35400">amerikanisch: stohrk</text>
  <rect x="20" y="140" width="440" height="66" rx="6" fill="#f4efe2" stroke="#333" stroke-width="2"/>
  <text x="36" y="180" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">ladder · latter</text>
  <text x="200" y="168" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#2c6fd8">britisch: verschieden</text>
  <text x="200" y="194" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#d35400">amerikanisch: gleich</text>
  <rect x="20" y="218" width="440" height="66" rx="6" fill="#f4efe2" stroke="#333" stroke-width="2"/>
  <text x="36" y="258" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">grass</text>
  <text x="200" y="246" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#2c6fd8">britisch: grahss</text>
  <text x="200" y="272" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#d35400">amerikanisch: gräss</text>
  <text x="20" y="300" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">Lesehilfe in deutscher Annäherung</text>

</svg>
