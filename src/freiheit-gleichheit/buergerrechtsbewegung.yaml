  - type: section
    id: verstehen
    title: Verstehen, belegen, meinen
    blocks:
      - type: single-choice
        id: buergerrechte-parks
        text: Warum blieb Rosa Parks 1955 im Bus sitzen? Welche Aussage passt zu den belegten Fakten?
        options:
          - text: Sie war einfach zu müde, es war ein Zufall.
            correct: false
            info: Das ist die vereinfachte Legende.
          - text: Es war ihre bewusste Entscheidung. Sie war seit Jahren in der NAACP aktiv, und andere waren schon vor ihr verhaftet worden.
            correct: true
            info: So beschreiben es die Quellen.
          - text: Sie war die erste Person, die in Montgomery dafür verhaftet wurde.
            correct: false
            info: Claudette Colvin wurde schon im März 1955 verhaftet.
        explanation: Die Legende lässt aus, dass sie seit Jahren aktiv war.
        hint: Lies Zeile 5.
      - type: single-choice
        id: buergerrechte-beleg
        text: Welche Zeile belegt, dass der Busboykott länger als einen Tag dauerte?
        options:
          - text: Zeile 6
            correct: true
            info: Das Ende war am 20. Dezember 1956.
          - text: Zeile 4
            correct: false
            info: Zeile 4 beschreibt die Sitzordnung.
          - text: Zeile 5
            correct: false
            info: Zeile 5 erklärt die Legende.
          - text: Zeile 8
            correct: false
            info: Zeile 8 nennt Gesetze.
        explanation: Zeile 6 nennt Anfang und Ende.
        hint: Suche die Daten 1955 und 1956.
      - type: open-task
        id: buergerrechte-meinung
        task: "Die heutige Lage einschätzen: Nenne zwei Fakten aus dem Lesestück, die zeigen, was sich seit den 1950er-Jahren geändert hat. Sage, welche Daten du noch brauchst. Schreibe drei bis vier Sätze auf Englisch."
        points:
          - text: Du nennst zwei belegte Änderungen, zum Beispiel Brown gegen Board of Education, das Ende der getrennten Busse, den Civil Rights Act oder den Voting Rights Act.
            source: /freiheit-gleichheit/buergerrechtsbewegung/#lesen
          - text: Du sagst, dass die Lage heute weiter diskutiert wird (zum Beispiel das Urteil von 2013), und nennst, welche Daten oder Quellen du noch brauchst.
            source: /freiheit-gleichheit/buergerrechtsbewegung/#lesen
          - text: Du schreibst ganze Sätze und trennst Fakten von deiner Meinung (I think …).
            kind: form
        solution: |
          Since the 1950s, the Supreme Court has ended segregation in public schools and on buses, and the Civil Rights Act of 1964 and the Voting Rights Act of 1965 banned discrimination. People still discuss voting rules today, for example after the ruling of 2013. To judge the situation, I would also like to see current figures from an official source.
        hint: Schau in Zeile 3, 6, 8 und 9.
  - type: section
    id: neu
    title: Zeitachse, Bus und Verfassung
    blocks:
      - type: timeline
        data: usa-zeitachse-heute
      - type: figure
        image: images/montgomery-bus-schema.svg
        alt: Schema der Sitzreihen eines Busses in Montgomery, von vorn nach hinten. Die zehn vorderen Sitze waren für weiße Fahrgäste reserviert, bei den sechzehn mittleren Sitzen entschied der Fahrer, die zehn hinteren Sitze waren für Schwarze Fahrgäste reserviert.
        caption: Schema nach der Beschreibung der Sitzordnung in Montgomery, nicht genau nach Maßstab. Vorn ist links. Die Zahlen der Sitze sind schematisch.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: note
        title: Merke
        blocks:
          - type: text
            text: "Trenne Fakt, Legende und Wertung. Ein **Fakt** hat eine Quelle: *Brown v. Board of Education wurde 1954 entschieden.* Eine **Wertung** ist eine Meinung: *Das Urteil kam zu spät.* Eine **Legende** ist eine einfache Geschichte, die nicht alles erzählt. Frage immer: Wer sagt das, und was belegt es?"
      - type: quote
        text: The right of citizens of the United States to vote shall not be denied or abridged by the United States or by any State on account of race, color, or previous condition of servitude
        origin:
          author: Verfassung der USA
          work: 15. Zusatzartikel, Abschnitt 1
          year: 1870
        source: "National Archives, 15th Amendment: https://www.archives.gov/milestone-documents/15th-amendment"
        licence: gemeinfrei (Dokument der US-Regierung)
      - type: single-choice
        id: buergerrechte-quelle
        text: Der Satz steht seit 1870 in der Verfassung. Warum war 1965 trotzdem ein neues Gesetz zum Wählen nötig?
        options:
          - text: Südstaaten hatten Regeln wie Lese- und Schreibtests, mit denen viele Schwarze nicht wählen konnten. Das neue Gesetz verbot sie.
            correct: true
            info: Lese- und Schreibtests und andere Hürden blieben.
          - text: Der Zusatzartikel galt nur für Frauen.
            correct: false
            info: Im Satz geht es um Hautfarbe, nicht um Geschlecht.
          - text: Die Verfassung wurde geändert und das Wahlrecht abgeschafft.
            correct: false
            info: Die Verfassung blieb unverändert.
        explanation: Hürden kamen aus Regeln einzelner Staaten.
        hint: Schau in Zeile 2.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: ordering
        id: buergerrechte-ordnen
        text: Bringe die vier Ereignisse in die richtige Reihenfolge, das früheste zuerst.
        items:
          - Das Oberste Gericht erklärt getrennte öffentliche Schulen für verfassungswidrig.
          - Rosa Parks wird in Montgomery verhaftet.
          - Rund 250 000 Menschen nehmen am Marsch auf Washington teil.
          - Präsident Johnson unterschreibt den Voting Rights Act.
        explanation: 1954, 1955, 1963, 1965.
        hint: Urteile und Gesetze, 1954 bis 1965.
      - type: matching
        id: buergerrechte-personen
        text: Wer oder was war das? Ordne zu.
        pairs:
          - left: the Women's Political Council
            right: planten den ersten Tag des Busboykotts und verteilten Flugblätter
          - left: Martin Luther King Jr.
            right: wurde Leiter der Montgomery Improvement Association
          - left: Claudette Colvin
            right: wurde als Schülerin im März 1955 verhaftet, weil sie im Bus sitzen blieb
          - left: the NAACP
            right: Organisation, in der Rosa Parks seit 1943 Mitglied war
        explanation: Die Bewegung hatte viele Beteiligte, nicht nur eine Person.
        hint: Denke an Montgomery im Jahr 1955.
      - type: matching
        id: buergerrechte-trennen
        text: "Fakt, Legende oder Wertung? Ordne zu."
        pairs:
          - left: Der Busboykott in Montgomery endete am 20. Dezember 1956.
            right: Fakt
          - left: Rosa Parks blieb nur sitzen, weil sie müde von der Arbeit war.
            right: Legende
          - left: Der Busboykott war die wichtigste Aktion der ganzen Bewegung.
            right: Wertung
        explanation: "Ein Fakt hat eine Quelle, eine Legende erzählt nicht alles, eine Wertung ist eine Meinung."
        hint: Frage dich, was sich belegen lässt und was nur jemand meint.
      - type: true-false
        id: buergerrechte-heute
        text: Stimmt das? Mit dem Voting Rights Act von 1965 war die Diskussion über das Wahlrecht für immer beendet.
        answer: false
        hint: Denke an das Urteil von 2013.
        explanation: 2013 beendete das Gericht eine Regel des Gesetzes.
      - type: language-task
        id: buergerrechte-hoeren
        languages:
          source: de
          target: en
        task: Hör zu und schreibe, was du hörst.
        form:
          case: hint
          punctuation: ok
        items:
          - audio: black-residents-organised-carpools-instead-of-riding-the-buses.mp3
            target: Black residents organised carpools instead of riding the buses.
          - audio: the-civil-rights-act-was-signed-by-president-johnson.mp3
            target: The Civil Rights Act was signed by President Johnson.
          - audio: rosa-parks-later-moved-from-montgomery-to-detroit.mp3
            target: Rosa Parks later moved from Montgomery to Detroit.
        hint: Hör jeden Satz zweimal.
  - type: section
    id: anwenden
    title: Selbst sprechen
    blocks:
      - type: speaking-task
        id: buergerrechte-nachsprechen
        language: en
        items:
          - audio: martin-luther-king-was-a-baptist-minister.mp3
            text: Martin Luther King was a Baptist minister.
          - audio: king-believed-in-nonviolent-protest.mp3
            text: King believed in nonviolent protest.
          - audio: the-supreme-court-ruled-against-segregation-in-public-education.mp3
            text: The Supreme Court ruled against segregation in public education.
        hint: Sprich langsam nach. Achte auf Baptist, nonviolent und segregation.
  - type: section
    id: weiter
    title: Nächster Halt
    blocks:
      - type: text
        text: "Von der Sklaverei bis zum Voting Rights Act hast du die Zeitachse der Rechte gelesen. Im letzten Halt dieses Kapitels geht es um **Migration und Minderheiten heute**: Du vergleichst Großbritannien und die USA und entscheidest, welche Quelle für welche Frage passt."
