# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Bürgerrechtsbewegung in den USA
description: Du liest einen Sachtext über Rosa Parks, Martin Luther King und die Bürgerrechtsbewegung, ordnest Ereignisse auf einer Zeitachse und schätzt die heutige Lage mit belegten Fakten ein.
competencies:
  - buergerrechtsbewegung
scope: "Die Seite erklärt die Bürgerrechtsbewegung in den USA mit Rosa Parks und Martin Luther King und lässt die heutige Lage mit belegten Fakten einschätzen. Nach dem Bürgerkrieg änderten der 13. (1865), 14. (1868) und 15. Zusatzartikel (1870) die Verfassung, doch Gesetze der Südstaaten (Jim Crow) trennten Schwarze und Weiße und erschwerten das Wählen. 1954 erklärte das Oberste Gericht getrennte öffentliche Schulen für verfassungswidrig. Rosa Parks blieb am 1. Dezember 1955 in einem Bus in Montgomery sitzen und wurde verhaftet. Die Legende, sie sei nur müde gewesen, ist vereinfacht: Sie war seit 1943 in der NAACP, andere (zum Beispiel Claudette Colvin) waren schon vorher verhaftet worden, und sie sagte selbst, sie sei müde gewesen nachzugeben. Der Busboykott dauerte vom 5. Dezember 1955 bis zum 20. Dezember 1956, die Montgomery Improvement Association wählte Martin Luther King zum Leiter. Am 28. August 1963 sprach King beim Marsch auf Washington (die Rede „I have a dream“ wird hier nur als Fakt genannt). Es folgten der Civil Rights Act (2. Juli 1964) und der Voting Rights Act (6. August 1965). 2013 beendete das Oberste Gericht in Shelby County gegen Holder eine Regel des Voting Rights Act; die Folgen werden diskutiert. Geübt werden Sachtext lesen, Fakten von Legenden und Wertungen trennen, Ereignisse ordnen und eine Einschätzung mit Belegen schreiben. Typische Fehler sind Rosa Parks war nur müde, sie war die Erste, der Boykott dauerte einen Tag, civil rights gleich civil war, die Bewegung war mit einem Gesetz beendet. Nicht hier: Sklaverei und Bürgerkrieg, Menschenrechte allgemein, Migration, Bewertungen heutiger Politik."
blocks:
  - type: section
    id: einstieg
    title: Gleiche Rechte, getrennte Busse
    blocks:
      - type: text
        text: Das Ende der Sklaverei bedeutete nicht, dass alle dieselben Rechte hatten. Davon erzählt diese Seite. Du brauchst dafür, was du über Sklaverei, Bürgerkrieg und Rechte gelernt hast. Vorher eine Frage an dich.
      - type: single-choice
        id: buergerrechte-start
        text: Was bedeutet „civil rights“?
        options:
          - text: "Bürgerrechte: Rechte der Bürger eines Staates, etwa das Wahlrecht"
            correct: true
            info: Rechte, die ein Staat seinen Bürgern gibt.
          - text: "Bürgerkrieg: ein Krieg zwischen Gruppen im eigenen Land"
            correct: false
            info: Der Bürgerkrieg heißt „civil war“.
          - text: "Menschenrechte: Rechte, die überall auf der Welt für jeden gelten"
            correct: false
            info: Das sind „human rights“, die Menschenrechte.
        explanation: Civil rights sind Bürgerrechte.
        hint: Denke an „human rights“ auf der Seite davor.
      - type: text
        text: "**Das kannst du danach:** Du beschreibst die Bürgerrechtsbewegung mit Rosa Parks und Martin Luther King und schätzt die heutige Lage mit belegten Fakten ein."
  - type: section
    id: lesen
    title: "Lesestück: The civil rights movement"
    blocks:
      - type: text
        text: |
          1. After the Civil War, three amendments changed the Constitution. The Thirteenth (1865) ended slavery. The Fourteenth (1868) gave citizenship to everyone born or naturalised in the United States. The Fifteenth (1870) said that the right to vote must not be denied because of race.
          2. But the rules did not match daily life. In the South, the Jim Crow laws separated Black and white people. In the following decades, Southern states also made it hard for Black citizens to vote, for example with literacy tests. In 1896 the Supreme Court allowed "separate but equal" facilities.
          3. In 1954 the Supreme Court decided unanimously in the case Brown v. Board of Education that separate public schools for Black and white children were unconstitutional.
          4. In Montgomery, Alabama, buses were segregated. The ten front seats were reserved for white passengers and the ten back seats for Black passengers. In the sixteen middle seats, the driver decided. About three quarters of the riders were Black.
      - type: text
        text: |
          5. On 1 December 1955, Rosa Parks refused to give up her seat for a white passenger and was arrested. A popular story says that she was simply tired after work. The facts are more complicated. Claudette Colvin, a fifteen-year-old student, had already been arrested in March 1955. Parks had been a member of the local NAACP since 1943. In summer 1955 she had attended a training course at the Highlander Folk School. Local leaders wanted a test case in court, and she seemed suitable. She later said that she was not physically tired, only tired of giving in.
          6. The Women's Political Council planned a one-day bus boycott for 5 December, the day of her trial, and produced about 35,000 leaflets. After the trial the boycott went on. A new group, the Montgomery Improvement Association, chose a young Baptist minister, Martin Luther King Jr., as its leader. People walked or shared cars to get to work. The boycott ended on 20 December 1956, when a ruling that bus segregation was unconstitutional came into force. In 1957 Rosa Parks left Montgomery and moved to Detroit.
          7. King, born in 1929, led the movement from 1955 until 1968 and used nonviolent protest. On 28 August 1963 about 250,000 people took part in the March on Washington, where he gave his famous "I Have a Dream" speech. In 1964 he received the Nobel Peace Prize. He was killed in Memphis in 1968.
      - type: text
        text: |
          8. In 1964 President Johnson signed the Civil Rights Act, which banned discrimination at work and in public places. In March 1965, police attacked marchers near Selma, Alabama, who were demanding voting rights. On 6 August 1965, Johnson signed the Voting Rights Act, with King and Parks among the guests. It bans racial discrimination in voting and outlaws literacy tests.
          9. The Voting Rights Act is still discussed. In 2013 the Supreme Court ended one of its rules, which had made some states ask Washington before they changed their voting rules. The Court said that this rule was out of date. People still discuss what this means for voters today.
