        caption: Randglossar · Wörter der Seite
        languages:
          source: de
          target: en
        entries:
          - target: slavery
            source: die Sklaverei
          - target: enslaved
            source: versklavt
          - target: the property
            source: das Eigentum
          - target: the cotton gin
            source: die Maschine, die Baumwolle von den Samen trennt
          - target: the Deep South
            source: der tiefe Süden (zum Beispiel Mississippi, Alabama)
          - target: the census
            source: die Volkszählung
          - target: the Union
            source: die Union, hier die Nordstaaten (nicht die Gewerkschaft)
          - target: the Confederacy
            source: die Konföderation, die elf Südstaaten
          - target: the rebellion
            source: der Aufstand
          - target: to surrender
            source: sich ergeben
          - target: the amendment
            source: der Zusatzartikel zur Verfassung
          - target: Reconstruction
            source: der Wiederaufbau nach dem Krieg
          - target: designated
            source: bestimmt, festgelegt
          - target: the Constitution
            source: die Verfassung
          - target: the plantation
            source: die Plantage, ein großer Landbetrieb für Baumwolle
          - target: to elect
