# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Sklaverei und Bürgerkrieg
description: Du liest einen Sachtext über die Sklaverei in den USA und den Amerikanischen Bürgerkrieg, vergleichst die Sichtweisen und liest einen Satz aus der Emancipation Proclamation.
competencies:
  - sklaverei-buergerkrieg
scope: "Die Seite erklärt die Geschichte der Sklaverei in den USA und den Amerikanischen Bürgerkrieg in Grundzügen. Sklaverei war in den USA von 1776 bis 1865 vor allem im Süden erlaubt; 1860 waren etwa vier Millionen Menschen versklavt. Nach der Wahl Abraham Lincolns 1860 verließen sieben, später elf Südstaaten die Union und bildeten die Konföderation. Der Krieg begann am 12. April 1861 bei Fort Sumter und endete 1865 mit der Aufgabe General Lees bei Appomattox. Die Emancipation Proclamation vom 1. Januar 1863 galt für versklavte Menschen in den Staaten im Aufstand, der 13. Zusatzartikel (Dezember 1865) beendete die Sklaverei im ganzen Land, außer als Strafe für ein Verbrechen. Der Krieg hatte mehrere Ursachen und Sichtweisen: Für den Süden stand die Sklaverei im Zentrum, für den Norden war das Ziel zunächst, die Union zu erhalten, versklavte Menschen suchten selbst Freiheit. Geübt werden das Lesen eines Sachtextes mit Zeilenbeleg, die Zuordnung von Sichtweisen, das Ordnen von Ereignissen und das Lesen einer Karte. Typische Fehler sind nur eine Ursache des Krieges, Sklaverei sei 1776 oder erst in den 1950er-Jahren geendet, die Emancipation Proclamation habe sofort alle befreit und Union gleich Gewerkschaft. Nicht hier: Bürgerrechtsbewegung und Rassentrennung im 20. Jahrhundert, Demokratie und Menschenrechte, Migration."
blocks:
  - type: section
    id: einstieg
    title: Ein Land und eine offene Frage
    blocks:
      - type: text
        text: Du kennst die Unabhängigkeit der USA von 1776. Die Frage, wer in diesem Land frei sein darf, blieb damals offen. Vorher eine Frage an dich.
      - type: single-choice
        id: sklaverei-start
        text: Seit wann ist die Sklaverei in den USA im ganzen Land verboten?
        options:
          - text: Seit dem Jahr 1776
            correct: false
            info: Die Sklaverei blieb danach noch fast neunzig Jahre erlaubt.
          - text: Seit dem Jahr 1865
            correct: true
            info: Im Dezember 1865 wurde der 13. Zusatzartikel ratifiziert.
          - text: Seit dem Jahr 1955
            correct: false
            info: Um 1955 kämpften Menschen gegen Rassentrennung. Die Sklaverei war da schon lange verboten.
        explanation: Die Sklaverei endete 1865.
        hint: Denke an das Ende des Krieges.
      - type: text
        text: "**Das kannst du danach:** Du erklärst die Geschichte der Sklaverei in den USA und den Amerikanischen Bürgerkrieg in Grundzügen. Du nennst mehrere Ursachen und Sichtweisen und ordnest wichtige Ereignisse."
  - type: section
    id: lesen
    title: "Lesestück: Slavery and the Civil War"
    blocks:
      - type: text
        text: |
          1. Slavery was legal in the United States from 1776 until 1865, mostly in the South. An enslaved person was treated as property: others could buy, sell or give away that person, and children were born into slavery.
          2. By 1805 every Northern state had begun to end slavery, some of them only slowly. In the South it grew. After the cotton gin was invented, farms in the Deep South needed more and more workers, and the demand for enslaved people rose.
          3. Congress banned the import of enslaved people from abroad in 1808. But more than a million people were sold inside the country, from the Upper South to the Deep South. By the census of 1860, about four million people were enslaved.
          4. In the 1850s the biggest political fight was about the West: should slavery spread into the new territories? Many Southern leaders said yes. Many people in the North wanted to stop it.
      - type: text
        text: |
          5. In 1860 Abraham Lincoln won the presidential election. He belonged to the Republican Party and opposed the spread of slavery into the West. Seven Southern states left the Union. Later four more followed, and the eleven states together formed the Confederacy.
          6. The war began on 12 April 1861, when Confederate forces fired on Fort Sumter, a fort in the harbour of Charleston, South Carolina.
          7. Historians today agree that slavery was at the centre of the Southern states' decision. For the North, the main aim at the start was to keep the Union together: it refused to accept that states could simply leave. So the two sides had different aims, and historians still discuss the reasons of the Union in detail.
          8. On 1 January 1863, Lincoln signed the Emancipation Proclamation. It declared people who were enslaved in the states in rebellion to be free, and it allowed Black men to join the Union army. It applied to more than three and a half million of the four million enslaved people, but it could only be enforced where the Union army advanced.
      - type: text
        text: |
          9. Enslaved people did not wait for this decree. Many had already escaped and looked for freedom behind Union lines.
          10. In the summer of 1863 the Union won at Vicksburg, which split the Confederacy in two at the Mississippi River. At Gettysburg, General Lee's attack on the North failed.
          11. In 1864 Lincoln put General Grant in command of all the Union armies. On 9 April 1865, after the Confederates had left their capital, Richmond, General Lee surrendered to General Grant at Appomattox. An estimated 700,000 soldiers had died. In December 1865 the Thirteenth Amendment to the Constitution ended slavery in the whole country, except as a punishment for a crime.
          12. Then began the time of Reconstruction: an attempt to rebuild the South and to give civil rights to the four million people who had been freed.
