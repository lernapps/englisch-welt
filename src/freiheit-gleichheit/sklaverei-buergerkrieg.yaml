          - target: to command
            source: den Oberbefehl haben, befehligen
  - type: section
    id: verstehen
    title: Verstehen, belegen, meinen
    blocks:
      - type: single-choice
        id: sklaverei-ursachen
        text: Warum kam es zum Bürgerkrieg?
        options:
          - text: Es ging nur um die Sklaverei, und der Norden kämpfte vom ersten Tag an nur für die Befreiung.
            correct: false
            info: Für den Norden ging es zuerst um die Union.
          - text: "Es gab mehrere Gründe: Für den Süden stand die Sklaverei im Zentrum, für den Norden war es zuerst das Ziel, die Union zu erhalten."
            correct: true
            info: So fassen es Historiker zusammen.
          - text: Es ging nur um Geld und Zölle, die Sklaverei spielte keine Rolle.
            correct: false
            info: Die Sklaverei war für die Südstaaten zentral.
        explanation: Es gab mehrere Ursachen und Sichtweisen.
        hint: Lies Zeile 5 bis 7.
      - type: single-choice
        id: sklaverei-beleg
        text: Welche Zeile belegt, dass versklavte Menschen schon vor 1863 Freiheit suchten?
        options:
          - text: Zeile 11
            correct: false
            info: Zeile 11 beschreibt das Kriegsende.
          - text: Zeile 3
            correct: false
            info: Zeile 3 nennt Zahlen, nicht die Flucht.
          - text: Zeile 7
            correct: false
            info: Zeile 7 nennt die Ziele der Seiten.
          - text: Zeile 9
            correct: true
            info: Viele flohen schon vorher.
        explanation: "Zeile 9: Viele flohen zur Union."
        hint: Suche die Zeile mit „escaped“.
      - type: open-task
        id: sklaverei-meinung
        task: "Aussage A: „Es ging nur um die Sklaverei.“ Aussage B: „Es ging nur um die Union.“ Schreibe zwei bis drei Sätze auf Englisch: Was passt, was fehlt?"
        points:
          - text: Du sagst, dass die Sklaverei für die Südstaaten im Zentrum stand.
            source: /freiheit-gleichheit/sklaverei-buergerkrieg/#lesen
          - text: Du sagst, dass der Norden zuerst die Union erhalten wollte.
            source: /freiheit-gleichheit/sklaverei-buergerkrieg/#lesen
          - text: Du schreibst ganze Sätze und nennst die Sichtweise (According to historians, for the South …).
            kind: form
        solution: |
          Statement A is partly right: According to historians, slavery was at the centre of the Southern states' decision. But the North first wanted to keep the Union together, so A is not the whole story. Statement B misses that the South left the Union because of slavery.
        hint: Lies Zeile 5 bis 7.
  - type: section
    id: neu
    title: Karte und Quelle
    blocks:
      - type: figure
        image: images/buergerkrieg-schema.svg
        alt: Schemakarte der USA. Im Norden liegt die Union, im Süden liegt die Konföderation als rosa Fläche. Vier Orte sind mit Punkten markiert, Gettysburg im Norden, Richmond im Südosten, Fort Sumter an der Südostküste und Vicksburg am Mississippi. Der Mississippi ist als blaue Linie beschriftet.
        caption: Schemakarte, nicht genau nach Maßstab. Norden ist oben. Die rosa Fläche zeigt die elf Staaten der Konföderation. Merke dir die vier Orte.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: note
        title: Merke
        blocks:
          - type: text
            text: "Wenn du über Geschichte sprichst, sagst du, wer etwas meint: **According to historians, …** (Nach Ansicht von Historikern …), **For the Southern leaders, …** (Für die Führenden des Südens …). So trennst du Fakten von Sichtweisen."
      - type: quote
        text: all persons held as slaves within said designated States, and parts of States, are, and henceforward shall be free
        origin:
          author: Abraham Lincoln
          work: Emancipation Proclamation
          year: 1863
        source: "National Archives, Transkription: https://www.archives.gov/exhibits/featured-documents/emancipation-proclamation/transcript.html"
        licence: gemeinfrei (Dokument der US-Regierung)
      - type: single-choice
        id: sklaverei-quelle
        text: Für wen galt dieser Satz aus dem Erlass?
        options:
          - text: Für alle versklavten Menschen in den USA, auch in den Staaten der Union
            correct: false
            info: Der Satz nennt bestimmte Staaten.
          - text: Für Menschen, die in den festgelegten Staaten im Aufstand versklavt waren
            correct: true
            info: Gemeint sind die Staaten im Aufstand.
          - text: Nur für Männer, die in die Armee der Union eintraten
            correct: false
            info: Der Satz nennt alle Menschen dort, nicht nur Soldaten.
        explanation: Er galt nur dort, wohin die Armee der Union kam.
        hint: Achte auf „designated States“.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: ordering
        id: sklaverei-ordnen
        text: Bringe die vier Ereignisse in die richtige Reihenfolge, das früheste zuerst.
        items:
          - Truppen der Konföderation beschießen Fort Sumter.
          - Lincoln unterschreibt die Emancipation Proclamation.
          - General Lee ergibt sich bei Appomattox.
          - Der 13. Zusatzartikel zur Verfassung wird ratifiziert.
        explanation: 1861, 1863, April 1865, Dezember 1865.
        hint: Erst beginnt der Krieg, am Ende steht der Zusatzartikel.
      - type: matching
        id: sklaverei-karte
        text: Ordne jeder Nummer den Namen des Ortes zu.
        material:
          - type: labelled-figure
            image: images/buergerkrieg-aufgabe.svg
            alt: "Schemakarte der USA im Bürgerkrieg ohne Namen mit vier Markierungen: Markierung 1 liegt im Nordosten, 2 im Osten im Süden, 3 an der Südostküste und 4 am Mississippi im Süden. Die blaue Linie ist der Mississippi."
            caption: Schemakarte, nicht genau nach Maßstab. Norden ist oben. Die rosa Fläche ist der Süden.
            source: eigene Zeichnung
            licence: CC-BY-4.0
            legend: false
            labels:
              - x: 79
                y: 39
                text: Gettysburg
                marker: "1"
              - x: 80
                y: 54
                text: Richmond
                marker: "2"
              - x: 83
                y: 61
                text: Fort Sumter
                marker: "3"
              - x: 59
                y: 64
                text: Vicksburg
                marker: "4"
        pairsFrom: material
        explanation: Gettysburg liegt im Norden, dort scheiterte Lees Angriff (Zeile 10). Richmond, Fort Sumter und Vicksburg liegen im Süden, in der Konföderation.
        hint: Fort Sumter liegt in South Carolina, Vicksburg am Mississippi.
      - type: language-task
        id: sklaverei-luecken
        languages:
          source: de
          target: en
        mode: gap
        task: Ergänze das Wort.
        form:
          case: hint
          punctuation: ok
        items:
          - cue: Die Nordstaaten nannte man die Union.
            target: The Northern states were called the [Union].
            mistakes:
              - answer: The Northern states were called the Confederacy.
                message: Confederacy waren die Südstaaten.
          - cue: Die Südstaaten bildeten die Konföderation.
            target: The Southern states formed the [Confederacy].
            mistakes:
              - answer: The Southern states made the Union.
                message: Union hießen die Nordstaaten.
          - cue: Der 13. Zusatzartikel beendete die Sklaverei.
            target: The Thirteenth [Amendment] ended slavery.
            mistakes:
              - answer: The Thirteenth Proclamation ended slavery.
                message: Proclamation ist der Erlass, ein Zusatzartikel heißt amendment.
        hint: Zwei Seiten haben zwei Namen.
      - type: language-task
        id: sklaverei-hoeren
        languages:
          source: de
          target: en
        task: Hör zu und schreibe, was du hörst.
        form:
          case: hint
          punctuation: ok
        items:
          - audio: lincoln-was-elected-president-in-eighteen-sixty.mp3
            target: Lincoln was elected president in (eighteen sixty|1860).
          - audio: many-enslaved-people-worked-on-large-cotton-plantations.mp3
            target: Many enslaved people worked on large cotton plantations.
          - audio: the-union-army-won-the-war-after-four-years-of-fighting.mp3
            target: The Union army won the war after (four|4) years of fighting.
        hint: Hör jeden Satz zweimal.
  - type: section
    id: anwenden
    title: Selbst sprechen
    blocks:
      - type: speaking-task
        id: sklaverei-nachsprechen
        language: en
        items:
          - audio: the-confederacy-had-its-capital-in-richmond.mp3
            text: The Confederacy had its capital in Richmond.
          - audio: general-grant-commanded-all-the-union-armies.mp3
            text: General Grant commanded all the Union armies.
          - audio: slavery-was-finally-ended-by-an-amendment-to-the-constitution.mp3
            text: Slavery was finally ended by an amendment to the Constitution.
        hint: Sprich langsam nach. Achte auf Confederacy, Richmond und Constitution.
  - type: section
    id: weiter
    title: Nächster Halt
    blocks:
      - type: text
        text: "Der Krieg endete 1865, die Frage der gleichen Rechte blieb. Als Nächstes geht es um **Gesellschaft und Politik**: Was bedeuten Demokratie, Menschenrechte und Engagement, und wie sind sie in der Geschichte der USA wichtig geworden?"
